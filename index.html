<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Elsewhere — Episode 1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Georgia,serif;background:#121625;color:#f3e9d8;max-width:700px;margin:35px auto;padding:20px;line-height:1.65}button{display:block;width:100%;padding:15px;margin:10px 0;color:#f3e9d8;background:#262b40;border:1px solid #cbb58d;border-radius:9px;text-align:left;font:inherit}h1{color:#ead19c}small{color:#c2ae87}</style>
<main id="game"></main>
<script>
const chapters={
train:{title:"The Last Train",text:"You wake to rain on the glass. Beneath the tracks: stars instead of earth. A conductor hands you a brass key. ‘The town has borrowed a minute,’ he says. ‘Don't let it borrow your life.’",options:[["Step into Greyhaven","square"],["Ask about the key","warning"]]},
warning:{title:"The conductor's warning",text:"‘When the clock forgets, remember. And when someone tells you who you are, ask what they want.’ The train stops.",options:[["Take the key and step off","square"]]},
square:{title:"Greyhaven · 11:47 PM",text:"The station clock ticks without moving. Three lights shine through the rain: a jazz bar, a library and a house on the cliff.",options:[["The Lantern Bar","bar"],["The Municipal Library","library"],["The house on the cliff","house"],["The station clock","clock"]]},
bar:{title:"The Lantern Bar",text:"At the piano, a man stops mid-song. ‘You're late,’ he says, grinning. ‘I was going to deliver an exceptionally good apology.’ He introduces himself as Rowan. ‘At 11:48, the town is supposed to move forward. Instead, the minute starts again. Evelyn Vale tried to stop it. Mira keeps her journal.’",options:[["‘Try the apology, then.’","banter"],["Visit Mira's library","library"],["Back into the rain","square"]]},
banter:{title:"An apology of questionable quality",text:"‘I'm sorry for being so charming in your general vicinity.’ ‘Terrible.’ ‘I know. I rehearsed.’ His grin fades. ‘I remember you being here before. I remember you never arriving at all.’",options:[["Ask about the clock","clock"],["Return to the square","square"]]},
library:{title:"The Municipal Library",text:"Mira, the librarian, recognizes the key. ‘Evelyn Vale froze the town one minute before her daughter Ada's accident. She left instructions for undoing it. Open the drawer if you want the truth.’",options:[["Unlock the drawer","drawer"],["Read a book bearing your own name","book"],["Return to the square","square"]]},
book:{title:"A possible life",text:"The book describes a life in which you remained in Greyhaven: quiet mornings, coffee, someone who knows when to leave you alone. On the last page: A POSSIBLE LIFE IS NOT A PROMISE.",options:[["Close the book","library"]]},
drawer:{title:"Evelyn's journal",text:"Inside the drawer: a silver gear and a journal. ‘Set the gear inside the station clock. Speak one truth: LET THE MINUTE PASS or LET THE MINUTE STAY. No choice will be painless.’ You take the gear.",options:[["Go to the station clock","endingchoice"],["Rest at the cottage first","house"]]},
house:{title:"The house on the cliff",text:"A fire burns. Rain softens against the window. On the bed sit fourteen absurdly soft pillows. A note reads: YOU ARE ALLOWED TO REST BEFORE YOU DECIDE.",options:[["Stay here a little longer","rest"],["Read the photograph on the mantel","photo"],["Return to town","square"]]},
rest:{title:"Nothing is required",text:"For a while, you do nothing. The world does not collapse. The fire is warm and the rain keeps time.",options:[["Rest another moment","rest"],["Go back outside","square"]]},
photo:{title:"The photograph",text:"Evelyn stands beside a girl in a yellow coat. Written on the back: ‘Ada deserves tomorrow, even if I cannot bear it.’",options:[["Return to the square","square"]]},
clock:{title:"The stopped clock",text:"The clock is stuck on 11:47. A faded inscription reads: THE TOWN BORROWED ONE MINUTE. IT NEVER PAID IT BACK.",options:[["Return to the square","square"],["Try the key","library"]]},
endingchoice:{title:"11:48",text:"You put the silver gear into the clock. Rowan and Mira stand quietly beside you. The bell is ready. For once, the next moment belongs to you.",options:[["Let the minute pass","free"],["Let the minute stay","stay"],["I need more time","square"]]},
free:{title:"Ending · The First Tomorrow",text:"The bell rings. Rain changes direction. Rowan looks out at the dawn. ‘Terrifying,’ he says. ‘Coffee?’ The train arrives. For the first time, staying and leaving are both choices.",options:[["Begin again","train"],["Return to the sanctuary","house"]]},
stay:{title:"Ending · The Kindness of Stillness",text:"The bell does not ring. The town remains safe inside its minute. No one gets hurt tomorrow. No one discovers tomorrow, either. The cottage waits with a warm fire and fourteen pillows.",options:[["Change your mind","endingchoice"],["Begin again","train"]]}
};
const key="elsewhere-episode1";let at=localStorage.getItem(key)||"train";
function go(id){at=id;localStorage.setItem(key,id);render()}function render(){let s=chapters[at]||chapters.train;document.getElementById("game").replaceChildren();const m=document.getElementById("game");let t=document.createElement("small");t.textContent="✦ THE ELSEWHERE PROJECT · EPISODE 01";m.append(t);let h=document.createElement("h1");h.textContent=s.title;m.append(h);let p=document.createElement("p");p.textContent=s.text;m.append(p);for(const [label,next] of s.options){let b=document.createElement("button");b.textContent=label;b.onclick=()=>go(next);m.append(b)}let foot=document.createElement("small");foot.textContent="Progress saves automatically on this device · No timers, no scores";m.append(foot)}render();
</script></html>
